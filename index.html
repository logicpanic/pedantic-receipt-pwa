<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d21">
<!-- 公開ホスティング（GitHub Pages）に置くため、社名・利用サービス名は書かない。
     内部向けの説明は receipt/HANDOFF.md にある。 -->
<title>レシート送信</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* 最小フォント14px（DESIGN.base.md §1 準拠） */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1d21; color: #e8eaed; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 18px; font-weight: 600; }
  #settingsBtn { background: none; border: 1px solid #444; color: #aaa; border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  #shutter {
    display: block; width: 100%; padding: 28px 16px; margin: 8px 0 16px;
    font-size: 20px; font-weight: 700; color: #1a1d21;
    background: #4cc38a; border: none; border-radius: 16px;
  }
  #shutter:disabled { background: #3a3f45; color: #777; }
  #shutter:active { transform: scale(0.98); }
  .hint { font-size: 14px; color: #9aa0a6; margin-bottom: 12px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 10px;
    background: #24282d; border-radius: 10px; padding: 10px 12px; font-size: 14px;
  }
  .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .item .st { margin-left: auto; flex-shrink: 0; font-size: 14px; }
  .item.err .st { color: #f28b82; }
  .item.ok .st { color: #4cc38a; }
  .item button { background: #3a3f45; color: #e8eaed; border: none; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
  dialog {
    background: #24282d; color: #e8eaed; border: 1px solid #444; border-radius: 12px;
    padding: 20px; width: min(92vw, 420px); margin: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; font-size: 14px; color: #9aa0a6; margin: 12px 0 4px; }
  dialog input {
    width: 100%; padding: 10px; font-size: 16px; border-radius: 8px;
    border: 1px solid #444; background: #1a1d21; color: #e8eaed;
  }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog button { padding: 10px 16px; font-size: 14px; border-radius: 8px; border: none; }
  #saveBtn { background: #4cc38a; color: #1a1d21; font-weight: 600; }
  #cancelBtn { background: #3a3f45; color: #e8eaed; }
  .note { font-size: 14px; color: #9aa0a6; margin-top: 10px; line-height: 1.5; }
  /* 連写モード（アプリ内カメラ）: シャッター1タップ＝撮影＋即送信 */
  #cam { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; }
  #cam[hidden] { display: none; }
  #video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  #camStatus {
    position: absolute; top: max(env(safe-area-inset-top), 12px); left: 12px; right: 88px;
    font-size: 14px; color: #fff; background: rgba(0,0,0,.55); border-radius: 8px; padding: 8px 10px;
  }
  #closeCam {
    position: absolute; top: max(env(safe-area-inset-top), 12px); right: 12px;
    background: rgba(0,0,0,.55); color: #fff; border: 1px solid #666; border-radius: 8px;
    padding: 8px 12px; font-size: 14px;
  }
  #camBar { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    padding: 16px 0 calc(env(safe-area-inset-bottom) + 20px); }
  #capture {
    width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff;
    background: rgba(255,255,255,.25); font-size: 14px; color: transparent;
  }
  #capture:active { background: #fff; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 11; transition: opacity .18s; }
  /* タップフォーカスの枠（タップ位置に一瞬出す） */
  #focusRing {
    position: absolute; width: 72px; height: 72px; border: 2px solid #ffd54c; border-radius: 8px;
    pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(1.3); z-index: 12;
  }
  #focusRing.on { opacity: 1; transform: translate(-50%, -50%) scale(1); transition: transform .15s, opacity .1s; }
</style>
</head>
<body>
<header>
  <h1>レシート送信</h1>
  <button id="settingsBtn" type="button">設定</button>
</header>

<button id="shutter" type="button">📷 連写モードで撮る</button>
<p class="hint">シャッター1タップで撮影＋送信。カメラは開いたままなので、そのまま次のレシートへどうぞ。<br>💡 レシートとカード利用明細の2枚セットは、<b>並べて1枚に収めて</b>撮ってください（明細のカード下4桁で法人/個人を自動判定します）。<br><a href="#" id="fallbackLink" style="color:#9aa0a6">標準カメラで1枚ずつ撮る</a></p>
<input id="camera" type="file" accept="image/*" capture="environment" multiple hidden>

<div id="log"></div>

<div id="cam" hidden>
  <video id="video" autoplay playsinline muted></video>
  <p id="camStatus">シャッターを押すと撮影＋送信されます</p>
  <div id="focusRing"></div>
  <button id="closeCam" type="button">✕ 終了</button>
  <div id="camBar"><button id="capture" type="button">撮影</button></div>
</div>
<div id="flash"></div>

<dialog id="settings">
  <h2 style="font-size:16px">初期設定</h2>
  <label for="whUrl">送信先URL（共有された「設定済みリンク」を丸ごと貼り付けでもOK）</label>
  <div style="display:flex; gap:8px">
    <input id="whUrl" type="url" placeholder="https://…" autocomplete="off" style="flex:1">
    <button id="pasteBtn" type="button" style="background:#3a3f45;color:#e8eaed;flex-shrink:0">📋 貼り付け</button>
  </div>
  <label for="userName">名前（送信時に表示されます）</label>
  <input id="userName" type="text" placeholder="例: 山田" autocomplete="off">
  <p class="note">設定はこの端末にだけ保存されます。ホーム画面に追加したアプリはブラウザと設定が別なので、初回だけ設定済みリンクの貼り付けが必要です（📋ボタンでコピー中のリンクをそのまま貼れます）。</p>
  <div class="row">
    <button id="cancelBtn" type="button">閉じる</button>
    <button id="saveBtn" type="button">保存</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';
  const LS_WH = 'receipt_webhook_url';
  const LS_NAME = 'receipt_user_name';
  const shutter = document.getElementById('shutter');
  const camera = document.getElementById('camera');
  const log = document.getElementById('log');
  const dlg = document.getElementById('settings');
  const whUrl = document.getElementById('whUrl');
  const userName = document.getElementById('userName');

  // 共有リンクの #フラグメントで送信先URLを受け取る（サーバーに送信されない・履歴に残さず即消去）
  if (location.hash.startsWith('#https://')) {
    localStorage.setItem(LS_WH, location.hash.slice(1));
    history.replaceState(null, '', location.pathname);
  }

  const getWebhook = () => localStorage.getItem(LS_WH) || '';
  const getName = () => localStorage.getItem(LS_NAME) || '';

  function openSettings() {
    whUrl.value = getWebhook();
    userName.value = getName();
    dlg.showModal();
  }
  document.getElementById('settingsBtn').onclick = openSettings;
  document.getElementById('cancelBtn').onclick = () => dlg.close();

  // 「設定済みリンク（…/#https://送信先）」を丸ごと貼っても、送信先URLだけを取り出す。
  // ホーム画面アプリはブラウザと localStorage が別＝リンクを開いた設定が引き継がれないため、
  // 初回起動での貼り付けを最短にする（何を貼ってもここで正規化する）
  function normalizeWebhookInput(raw) {
    const t = String(raw ?? '').trim();
    const hashAt = t.indexOf('#https://');
    if (hashAt >= 0) return t.slice(hashAt + 1);
    return t;
  }

  document.getElementById('pasteBtn').onclick = async () => {
    try {
      whUrl.value = normalizeWebhookInput(await navigator.clipboard.readText());
    } catch {
      alert('貼り付けできませんでした。入力欄を長押しして「ペースト」してください');
    }
  };

  document.getElementById('saveBtn').onclick = () => {
    const u = normalizeWebhookInput(whUrl.value);
    if (u && !u.startsWith('https://')) {
      alert('送信先URLの形式が正しくありません');
      return;
    }
    if (u) localStorage.setItem(LS_WH, u);
    localStorage.setItem(LS_NAME, userName.value.trim());
    dlg.close();
    refresh();
  };

  function refresh() {
    const ready = Boolean(getWebhook());
    shutter.disabled = !ready;
    shutter.textContent = ready ? '📷 連写モードで撮る' : '設定が必要です（右上の「設定」から）';
  }

  // ---- 連写モード（アプリ内カメラ） ------------------------------------------
  // 標準カメラ（file input + capture）はiOSだと「シャッター→Use Photo→戻る」の3タップ必要で
  // 連続撮影がだるい。getUserMedia のライブビューを開きっぱなしにして、1タップ＝撮影＋即送信にする。
  const cam = document.getElementById('cam');
  const video = document.getElementById('video');
  const camStatus = document.getElementById('camStatus');
  const flash = document.getElementById('flash');
  const focusRing = document.getElementById('focusRing');
  let stream = null;
  let shotCount = 0;

  // シャッター音（合成音・素材ファイルなし）。フレーム確保の瞬間に鳴らす＝
  // 「鳴ったらもうカメラを動かしてよい」の合図。※端末がマナーモードだと鳴らないことがある
  let audioCtx = null;
  function playShutterSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const click = (t0, freq, dur) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.4, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur);
      };
      const t = audioCtx.currentTime;
      click(t, 2600, 0.035);        // 「カ」
      click(t + 0.07, 1700, 0.06);  // 「シャ」
    } catch { /* 音が出せない環境でも撮影は続行 */ }
  }

  // タップでピント合わせ。フォーカス枠は常に出す（操作の手応え）。
  // 実際のフォーカス移動は対応端末のみ（focusMode/pointsOfInterest 対応時に applyConstraints。
  // iOS Safari は 2026-08 時点で非対応＝常時オートフォーカス任せになる）
  video.addEventListener('click', (ev) => {
    const rect = video.getBoundingClientRect();
    focusRing.style.left = `${ev.clientX - rect.left}px`;
    focusRing.style.top = `${ev.clientY - rect.top}px`;
    focusRing.classList.remove('on');
    void focusRing.offsetWidth; // アニメーション再生のためのリフロー
    focusRing.classList.add('on');
    setTimeout(() => focusRing.classList.remove('on'), 900);

    const track = stream?.getVideoTracks?.()[0];
    const caps = track?.getCapabilities?.() ?? {};
    if (!track || (!caps.focusMode && !('pointsOfInterest' in caps))) return;
    const adv = {};
    if (Array.isArray(caps.focusMode)) {
      adv.focusMode = caps.focusMode.includes('single-shot') ? 'single-shot'
        : (caps.focusMode.includes('continuous') ? 'continuous' : caps.focusMode[0]);
    }
    if ('pointsOfInterest' in caps) {
      adv.pointsOfInterest = [{
        x: Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width)),
        y: Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height)),
      }];
    }
    track.applyConstraints({ advanced: [adv] }).catch(() => { /* 非対応端末は枠表示のみ */ });
  });

  async function openCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 4096 } },
        audio: false,
      });
    } catch {
      // 起動不可（権限拒否・非対応）は標準カメラにフォールバック
      alert('カメラを起動できなかったので、標準カメラで撮影します');
      camera.click();
      return;
    }
    video.srcObject = stream;
    shotCount = 0;
    camStatus.textContent = 'シャッターを押すと撮影＋送信されます';
    cam.hidden = false;
  }

  function closeCam() {
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    video.srcObject = null;
    cam.hidden = true;
  }

  function updateCamStatus() {
    if (cam.hidden) return;
    const latest = log.querySelector('.item .st');
    camStatus.textContent = `${shotCount}枚撮影${latest?.textContent ? `／最新: ${latest.textContent}` : ''}`;
  }

  document.getElementById('capture').onclick = () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0);
    // drawImage が済んだ＝フレーム確保完了。ここで音と光を出す＝「もう動かしてOK」の合図
    playShutterSound();
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 120);
    canvas.toBlob((blob) => {
      if (!blob) { camStatus.textContent = '⚠️ 撮影に失敗しました（もう一度）'; return; }
      shotCount++;
      addItem(new File([blob], `receipt-${Date.now()}.jpg`, { type: 'image/jpeg' }));
      updateCamStatus();
    }, 'image/jpeg', 0.92);
  };
  document.getElementById('closeCam').onclick = closeCam;

  shutter.onclick = openCam;
  document.getElementById('fallbackLink').onclick = (e) => { e.preventDefault(); camera.click(); };
  camera.onchange = async () => {
    const files = [...camera.files];
    camera.value = '';
    for (const f of files) addItem(f);
  };

  // 長辺2000px・JPEG品質0.85 に圧縮（OCR可読性を保ちつつ転送量を落とす）。
  // 変換できない形式（HEIC等でデコード不可）は原本のまま送る。
  async function compress(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale);
      const h = Math.round(bmp.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
      bmp.close();
      const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.85));
      if (!blob) throw new Error('toBlob null');
      return { blob, name: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
    } catch {
      return { blob: file, name: file.name };
    }
  }

  async function upload(blob, name) {
    const fd = new FormData();
    const uname = getName();
    fd.append('payload_json', JSON.stringify({
      username: uname ? `${uname}（レシートPWA）` : 'レシートPWA',
      allowed_mentions: { parse: [] },
    }));
    fd.append('files[0]', blob, name);
    const res = await fetch(getWebhook(), { method: 'POST', body: fd });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }

  function addItem(file) {
    const el = document.createElement('div');
    el.className = 'item';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    const label = document.createElement('span');
    label.textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    const st = document.createElement('span');
    st.className = 'st';
    el.append(img, label, st);
    log.prepend(el);

    const run = async () => {
      el.className = 'item';
      st.textContent = '送信中…';
      try {
        const { blob, name } = await compress(file);
        await upload(blob, name);
        el.className = 'item ok';
        st.textContent = '✅ 送信済み';
        updateCamStatus();
      } catch (e) {
        el.className = 'item err';
        st.textContent = '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = `失敗（${e.message}）再送`;
        btn.onclick = () => { btn.remove(); run(); };
        st.append(btn);
        if (!cam.hidden) camStatus.textContent = `${shotCount}枚撮影／⚠️ 送信失敗あり（終了後に一覧から再送できます）`;
      }
    };
    run();
  }

  if (!getWebhook()) openSettings();
  refresh();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
